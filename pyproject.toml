[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rpp_testing"
version = "0.1.0"
description = "Packaged fixture data for RPP tests"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
integration = ["rpp-cli>=0.1,<0.2", "rpp-py>=0.1,<0.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
rpp_testing = ["data/**", "rpp_autogen/**", "rpp_autogen/.rpp/**"]

[tool.setuptools.packages.find]
include = ["rpp_testing", "rpp_testing.*"]

[tool.setuptools.data-files]
"share/ament_index/resource_index/packages" = ["resource/rpp_testing"]
"share/rpp_testing" = ["package.xml"]
